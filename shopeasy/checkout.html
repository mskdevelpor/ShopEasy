<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | ShopEasy</title><link rel="stylesheet" href="css/style.css"><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script defer src="js/data.js"></script><script defer src="js/store.js"></script><script defer src="js/ui.js"></script></head><body><header class="site-header"><a class="brand" href="index.html">Shop<span>Easy</span></a><button class="menu-toggle" aria-label="Toggle navigation">☰</button><nav class="nav"><a href="index.html">Home</a><a href="products.html">Products</a><a href="cart.html">Cart <span class="cart-count">0</span></a><a class="active" href="checkout.html">Checkout</a><a href="contact.html">Contact</a></nav></header><main class="page-wrap"><div class="page-title"><p class="eyebrow">SECURE & SIMPLE</p><h1>Checkout</h1><p>Enter your details to place a demo order.</p></div><div class="checkout-layout"><form id="checkout-form" class="form-card" novalidate><h2>Delivery details</h2><div class="form-grid"><label>Full name<input name="name" type="text" required minlength="3" autocomplete="name"><small class="field-error"></small></label><label>Email address<input name="email" type="email" required autocomplete="email"><small class="field-error"></small></label><label>Phone number<input name="phone" type="tel" required pattern="[0-9+() -]{7,20}" placeholder="03xx xxxxxxx" autocomplete="tel"><small class="field-error"></small></label><label>City<input name="city" type="text" required minlength="2" autocomplete="address-level2"><small class="field-error"></small></label><label class="full-field">Delivery address<textarea name="address" required minlength="8" rows="3" autocomplete="street-address"></textarea><small class="field-error"></small></label><label>Delivery option<select name="delivery" required><option value="">Choose delivery</option><option value="standard">Standard delivery</option><option value="express">Express delivery</option></select><small class="field-error"></small></label><fieldset><legend>Payment method</legend><label class="choice"><input type="radio" name="payment" value="cash" required> Cash on delivery</label><label class="choice"><input type="radio" name="payment" value="online"> Online (demo only)</label><small class="field-error"></small></fieldset><label class="full-field choice"><input type="checkbox" name="terms" required> I confirm these details are correct.</label><small class="field-error full-field"></small></div><button class="btn" type="submit">Place demo order</button><p id="checkout-message" class="success-message" role="status"></p></form><aside id="checkout-summary" class="summary-card"><h2>Order summary</h2><p>Loading your cart…</p></aside></div></main><footer class="footer"><a class="brand" href="index.html">Shop<span>Easy</span></a><p>This is a front-end demo; no real payment is processed.</p></footer></body></html>
